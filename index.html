<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- page:start -->
<title>Amberline Terminal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A browser-based, multi-panel market terminal with a command line, live charts and simulated data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="src/terminal.css">
<!-- head:end -->
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="mark" aria-hidden="true">A</span><span class="word">Amberline</span><span class="sub">Terminal</span></div>
    <div class="feed"><span class="dot" aria-hidden="true"></span>Simulated feed</div>
    <div class="clocks">
      <span>Session <b id="simClock">13:00</b> ET</span>
      <span id="mktState" class="state">Market open</span>
      <span id="dateLbl"></span>
    </div>
  </header>

  <div class="cmdwrap">
    <div class="cmdrow">
      <label for="cmd" class="prompt"><span id="promptPanel">1</span>&gt;</label>
      <div class="cmdbox">
        <input id="cmd" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false"
          role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggest"
          placeholder="Ticker and function, e.g. NVTK GP. Press Enter to run.">
        <ul id="suggest" class="suggest" role="listbox" aria-label="Suggestions" hidden></ul>
      </div>
      <button class="go" id="goBtn" type="button">GO</button>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </div>

  <main class="grid" id="grid" aria-label="Panels"></main>

  <nav class="fkeys" id="fkeys" aria-label="Function keys">
    <span class="disclaim">Fictional securities and simulated prices. Not investment information.</span>
  </nav>
  <footer class="tape" aria-label="Ticker tape"><div class="tape-track" id="tape"></div></footer>
</div>
<noscript><p style="padding:16px">Amberline Terminal needs JavaScript to run.</p></noscript>
<script src="src/data.js"></script>
<script src="src/terminal.js"></script>
<!-- page:end -->
</body>
</html>
